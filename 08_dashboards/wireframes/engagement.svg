  <text x="45.0" y="172" class="card-val">51.81s</text>
  <text x="45.0" y="188" class="card-sub">Median: 42.0s across 7,913 sess</text>
  <rect x="320.0" y="122" width="270.0" height="75" class="panel-bg" />
  <text x="335.0" y="144" class="card-title">7-DAY STREAK RETENTION</text>
  <text x="335.0" y="172" class="card-val">42.10%</text>
  <text x="335.0" y="188" class="card-sub">421 users reached milestone</text>
  <rect x="610.0" y="122" width="270.0" height="75" class="panel-bg" />
